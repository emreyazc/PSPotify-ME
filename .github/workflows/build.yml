name: Build PSP EBOOT

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:v20261001
    steps:
      - name: Install build host helpers
        # fontTools subsets the UI fonts (scripts/ui_assets.py).
        run: |
          apk add --no-cache python3 py3-pip
          pip install --break-system-packages fonttools==4.55.0
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build pinned dependencies, EBOOT and verify binaries
        shell: bash
        run: python3 scripts/build.py
      - name: Upload PSP game package and debugging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PSPotify-ME
          path: dist/
          if-no-files-found: error

  background_prx:
    name: Build independent GAME audio PRX
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:v20261001
    steps:
      - name: Install Python for WAV test sample
        run: apk add --no-cache python3
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build standalone PRX and PCM16 music sample
        shell: bash
        run: python3 scripts/build_background.py
      - name: Validate artifact and WAV format
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import wave
          p = Path("dist/background/pspotify_bg.prx")
          assert p.is_file() and p.stat().st_size > 100, "missing PRX"
          for wavname in ("music.wav", "music01.wav", "music02.wav", "music03.wav"):
              with wave.open("dist/background/" + wavname, "rb") as w:
                  assert w.getnchannels() == 2, wavname
                  assert w.getsampwidth() == 2, wavname
                  assert w.getframerate() == 44100, wavname
                  assert w.getnframes() > 44100, wavname
          assert Path("dist/background/enabled-default-off.txt").read_text().strip() == "0"
          print("BACKGROUND PRX AND THREE TRACKS CHECK PASS")
          PY
      - name: Upload GAME PRX test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PSPotify-BG-Experimental
          path: dist/background/
          if-no-files-found: error
